<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Page</title>
</head>
<body>
    <header></header>
    
    <div id="content">
        <form action="">
            <label for="usr-name">Name:*</label>
            <input type="text" name="usr-name" id="usr-name" required>
            <label for="usr-email">Email:*</label>
            <input type="email" name="usr-email" id="usr-email" required>
            <label for="usr-comment">Comment:</label>
            <textarea name="usr-comment" id="usr-comment" rows="5"></textarea>
            <button>Submit</button>
        </form>
    </div>

    <footer></footer>
</body>
</html>
